<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dtLineGradient" x1="15%" y1="90%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="dtApexGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0b0f19" />

  <!-- Outer Main Triangle Edges -->
  <line x1="50" y1="14" x2="20" y2="78" stroke="url(#dtLineGradient)" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="14" x2="80" y2="78" stroke="url(#dtLineGradient)" stroke-width="3" stroke-linecap="round" />
  <line x1="20" y1="78" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="78" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="3" stroke-linecap="round" />

  <!-- Central Vertical Spine Line -->
  <line x1="50" y1="14" x2="50" y2="90" stroke="url(#dtApexGradient)" stroke-width="3" stroke-linecap="round" />

  <!-- Geodesic Cross / Diagonal Lattice Structures -->
  <line x1="50" y1="38" x2="28" y2="60" stroke="url(#dtLineGradient)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="50" y1="38" x2="72" y2="60" stroke="url(#dtLineGradient)" stroke-width="2.4" stroke-linecap="round" />
  
  <line x1="28" y1="60" x2="50" y2="62" stroke="url(#dtLineGradient)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="72" y1="60" x2="50" y2="62" stroke="url(#dtLineGradient)" stroke-width="2.4" stroke-linecap="round" />
  
  <line x1="50" y1="38" x2="50" y2="62" stroke="url(#dtLineGradient)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="28" y1="60" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="72" y1="60" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Nodes (Circles at intersections) -->
  <circle cx="50" cy="14" r="5" fill="url(#blueGlow)" />
  <circle cx="50" cy="38" r="4.2" fill="url(#blueGlow)" />
  <circle cx="50" cy="62" r="4.5" fill="url(#dtLineGradient)" />
  <circle cx="50" cy="90" r="4.2" fill="url(#dtLineGradient)" />
  <circle cx="28" cy="60" r="4" fill="url(#blueGlow)" />
  <circle cx="20" cy="78" r="4.5" fill="#2563eb" />
  <circle cx="72" cy="60" r="4" fill="url(#goldGlow)" />
  <circle cx="80" cy="78" r="4.5" fill="url(#goldGlow)" />
</svg>
