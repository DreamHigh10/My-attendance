<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="dtLineGradient" x1="15%" y1="90%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="65%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient background glow circles -->
  <circle cx="600" cy="220" r="300" fill="#6366f1" opacity="0.15" filter="blur(80px)" />
  <circle cx="900" cy="400" r="250" fill="#10b981" opacity="0.12" filter="blur(80px)" />

  <!-- Logo Group Scaled and Centered -->
  <g transform="translate(475, 80) scale(2.5)">
    <!-- Outer Main Triangle Edges -->
    <line x1="50" y1="12" x2="20" y2="78" stroke="url(#dtLineGradient)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="12" x2="80" y2="78" stroke="url(#dtLineGradient)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="78" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="80" y1="78" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Central Vertical Spine Line -->
    <line x1="50" y1="12" x2="50" y2="90" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Geodesic Cross / Diagonal Lattice Structures -->
    <line x1="50" y1="35" x2="28" y2="58" stroke="url(#dtLineGradient)" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="35" x2="72" y2="58" stroke="url(#dtLineGradient)" stroke-width="2" stroke-linecap="round" />
    
    <line x1="28" y1="58" x2="50" y2="60" stroke="url(#dtLineGradient)" stroke-width="2" stroke-linecap="round" />
    <line x1="72" y1="58" x2="50" y2="60" stroke="url(#dtLineGradient)" stroke-width="2" stroke-linecap="round" />
    
    <line x1="50" y1="35" x2="50" y2="60" stroke="url(#dtLineGradient)" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="58" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="2" stroke-linecap="round" />
    <line x1="72" y1="58" x2="50" y2="90" stroke="url(#dtLineGradient)" stroke-width="2" stroke-linecap="round" />

    <!-- Nodes -->
    <circle cx="50" cy="12" r="4.5" fill="url(#blueGlow)" />
    <circle cx="50" cy="35" r="4" fill="url(#blueGlow)" />
    <circle cx="50" cy="60" r="4.2" fill="url(#dtLineGradient)" />
    <circle cx="50" cy="90" r="4" fill="url(#dtLineGradient)" />
    <circle cx="28" cy="58" r="3.8" fill="url(#blueGlow)" />
    <circle cx="20" cy="78" r="4.2" fill="#2563eb" />
    <circle cx="72" cy="58" r="3.8" fill="url(#goldGlow)" />
    <circle cx="80" cy="78" r="4.2" fill="url(#goldGlow)" />
  </g>

  <!-- Typography -->
  <text x="600" y="420" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="8">
    THE DREAM TEAM
  </text>
  
  <text x="600" y="475" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">
    ATTENDANCE &amp; COHORT MANAGEMENT SYSTEM
  </text>

  <text x="600" y="530" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
    Engr. Kehinde Ogungbade &amp; Facilitation Team
  </text>
</svg>
